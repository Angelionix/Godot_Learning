# ============================================================
# Nginx — Main Configuration
# Godot Learning Platform
# ============================================================
# Этот конфиг обеспечивает:
#   1. Reverse proxy к Next.js приложению
#   2. COOP/COEP заголовки для SharedArrayBuffer (нужны Godot WASM)
#   3. Gzip-сжатие для статических файлов
#   4. Кэширование статики
#   5. Security headers
#   6. Проксирование MinIO Console (S3 UI)
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';
    access_log /var/log/nginx/access.log main;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Кэширование статических файлов
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # Лимиты
    client_max_body_size 50m; # Для загрузки файлов проектов
    client_body_buffer_size 128k;

    # Upstreams
    upstream nextjs_app {
        server app:3000;
    }

    upstream godot_editor {
        server godot-editor:8080;
    }

    upstream minio_console {
        server minio:9001;
    }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
