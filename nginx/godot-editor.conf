# ============================================================
# Godot Web Editor — Placeholder Server
# ============================================================
# Этот конфиг обслуживает placeholder-страницу Godot Editor
# пока реальные WASM-файлы не будут добавлены.
#
# Для реального Godot Editor замените файлы в /usr/share/nginx/html/
# на экспортированные Web-файлы Godot (editor.html, .wasm, .js, .data)
# ============================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # COOP/COEP заголовки (обязательны для SharedArrayBuffer)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # MIME типы для Godot WASM
    types {
        application/wasm wasm;
        application/javascript js;
        application/octet-stream data;
        text/html html;
    }

    # Кэширование WASM-файлов
    location ~* \.(wasm|data)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
