# ============================================================
# Godot Learning Platform — Default Server Configuration
# ============================================================
# Порт 80 (HTTP) — для development
# Порт 443 (HTTPS) — для production (раскомментировать)
#
# ВАЖНО: COOP/COEP заголовки необходимы для SharedArrayBuffer,
# который требуется Godot Web Editor (WASM).
# Без этих заголовков редактор не будет работать!
# ============================================================

# --- HTTP Server ---
server {
    listen 80;
    server_name localhost;

    # Редирект на HTTPS (раскомментировать для production)
    # return 301 https://$host$request_uri;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Next.js Application ---
    location / {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Таймауты для Server-Sent Events
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Next.js Static Files (кэширование) ---
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_set_header Host $host;

        # Агрессивное кэширование статических файлов Next.js
        # Файлы содержат хеш в имени — безопасно кэшировать надолго
        expires 365d;
        add_header Cache-Control "public, immutable";

        # COOP/COEP не нужны для статики
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Godot Web Editor (iframe) ---
    # Обслуживается с COOP/COEP заголовками для SharedArrayBuffer
    location /editor/godot/ {
        proxy_pass http://godot_editor/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # === CRITICAL: COOP/COEP for SharedArrayBuffer ===
        # Эти заголовки обязательны для работы Godot WASM!
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # WASM файлы нужно кэшировать
        location ~* /editor/godot/.*\.(wasm|data|js)$ {
            proxy_pass http://godot_editor;
            proxy_set_header Host $host;

            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;

            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # --- MinIO Console (S3 UI) ---
    location /minio/ {
        proxy_pass http://minio_console/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для MinIO Console
        proxy_read_timeout 86400s;
    }

    # --- Health Check ---
    location /health {
        proxy_pass http://nextjs_app/api/health;
        access_log off;
    }
}

