# ============================================================
# Godot Learning Platform — Docker Compose
# ============================================================
# Запускает полную инфраструктуру:
#   - app:       Next.js приложение (standalone)
#   - minio:     S3-совместимое хранилище для файлов проектов
#   - nginx:     Reverse proxy с COOP/COEP заголовками
#   - godot-editor: Godot Web Editor (WASM)
#
# Использование:
#   docker compose up -d          # Запуск
#   docker compose logs -f app    # Логи приложения
#   docker compose down           # Остановка
#
# Минимум: docker compose up -d app minio
# Полная:  docker compose up -d
# ============================================================

services:
  # === Next.js Application ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: godot-learning-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/db/custom.db
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=user-projects
      - GODOT_EDITOR_URL=http://localhost:8080
    volumes:
      - app-db:/app/db
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - godot-network

  # === MinIO (S3-совместимое хранилище) ===
  minio:
    image: minio/minio:latest
    container_name: godot-learning-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - godot-network

  # === MinIO Init — создаёт бакет при первом запуске ===
  minio-init:
    image: minio/mc:latest
    container_name: godot-learning-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/user-projects --ignore-existing;
      mc anonymous set download myminio/user-projects;
      echo 'Bucket user-projects created';
      exit 0;
      "
    networks:
      - godot-network

  # === Nginx Reverse Proxy ===
  # Обслуживает Godot Editor и проксирует к Next.js
  # Устанавливает COOP/COEP заголовки для SharedArrayBuffer
  nginx:
    image: nginx:alpine
    container_name: godot-learning-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL сертификаты (раскомментировать для production)
      # - ./nginx/ssl:/etc/nginx/ssl:ro
      # Godot Editor WASM файлы
      - godot-editor-files:/usr/share/nginx/godot-editor:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - godot-network

  # === Godot Web Editor (Placeholder) ===
  # В реальной среде здесь будет контейнер с Godot Web Editor,
  # собранный из Godot Editor WASM-файлов.
  # Пока используем placeholder-страницу.
  godot-editor:
    image: nginx:alpine
    container_name: godot-learning-editor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/godot-editor.conf:/etc/nginx/conf.d/default.conf:ro
      - godot-editor-files:/usr/share/nginx/html:ro
    networks:
      - godot-network

# === Volumes ===
volumes:
  app-db:
    driver: local
  minio-data:
    driver: local
  godot-editor-files:
    driver: local

# === Networks ===
networks:
  godot-network:
    driver: bridge
